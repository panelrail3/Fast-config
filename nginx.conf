worker_processes 1;
events { worker_connections 4096; }
http {
 access_log /app/runtime/nginx-access.log;
 error_log /app/runtime/nginx-error.log warn;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server { listen 0.0.0.0:8080; server_name _;
  location = /ws-vless { proxy_pass http://127.0.0.1:10001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_buffering off; proxy_read_timeout 3600s; }
  location = /hu-vless { proxy_pass http://127.0.0.1:10002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_buffering off; proxy_read_timeout 3600s; }
  location = /xhttp-vless { proxy_pass http://127.0.0.1:10003; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 3600s; }
  location / { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto https; }
 }
}
