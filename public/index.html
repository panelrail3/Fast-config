<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLESS Panel</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:20px}input,button{padding:12px;margin:6px 0}input{width:100%;box-sizing:border-box}button{cursor:pointer}.card{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}pre{white-space:pre-wrap;word-break:break-all;background:#f5f5f5;padding:12px;border-radius:8px}.hidden{display:none}</style></head><body><h1>VLESS Panel</h1><section id="login"><h2>Login</h2><input id="user" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><p id="err"></p></section><section id="app" class="hidden"><h2>Generated VLESS Configurations</h2><div id="configs"></div><h3>Change password</h3><input id="newpass" type="password" placeholder="New password"><button onclick="changePass()">Change password</button></section><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});if(!r.ok){err.textContent='Invalid username or password';return}login.style;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');load()}async function load(){let r=await fetch('/api/configs');let j=await r.json();configs.innerHTML=j.configs.map(c=>'<div class="card"><b>'+c.name+'</b><p>UUID: '+c.uuid+'</p><pre>'+c.url+'</pre><button onclick="navigator.clipboard.writeText('+JSON.stringify(c.url)+')">Copy</button></div>').join('')}async function changePass(){let r=await fetch('/api/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:newpass.value})});alert(r.ok?'Password changed':'Password change failed')}</script></body></html>
